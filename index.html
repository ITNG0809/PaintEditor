<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>コスチュームエディター</title>
<meta name="description" content="PaintEditorでアニメーションを作成・編集し、描いた作品に動きを加えて表現を広げられるアプリです。">
<meta property="og:title" content="コスチュームエディター">
<meta property="og:description" content="PaintEditorでアニメーションを作成・編集し、描いた作品に動きを加えて表現を広げられるアプリです。">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="stylesheet" href="./style.css">
<!-- ↓ 読み込み順は重要。animation.js より前に必要（詳しくは README.md） -->
<script src="./scratch-compat.js"></script>
<script src="./sound-core.js"></script>
<script src="./sound-effects.js"></script>
</head><body>
<div id="app">
<div id="mbar" role="menubar" aria-label="メニューバー"></div>
<div id="top">
<input id="cname" type="text" maxlength="60" spellcheck="false" autocomplete="off" aria-label="コスチュームの名前(Enterで確定)" title="コスチュームの名前を変更(Enterで確定、Escで元に戻す)">
<button id="addv" data-i="addv" data-t="ベクターのコスチュームを追加" data-l="ベクター"></button>
<button id="addb" data-i="addb" data-t="ビットマップのコスチュームを追加" data-l="ビット"></button>
<button id="impb" data-i="imp" data-t="画像を読み込む(原寸)"></button><input type="file" id="imp" accept="image/*" hidden>
<span class="sep"></span>
<button id="undo" data-i="undo" data-t="元に戻す"></button><button id="redo" data-i="redo" data-t="やり直し"></button>
<button id="zi" data-i="zin" data-t="拡大"></button><button id="zo" data-i="zout" data-t="縮小"></button>
<button id="zf" data-i="fit" data-t="全体表示"></button><button id="z1" data-i="z1" data-t="等倍(100%)"></button>
<span class="sep"></span>
<button id="sv" data-i="save" data-t="プロジェクトを保存(JSON)"></button>
<button id="ld" data-i="load" data-t="プロジェクトを読み込む"></button><input type="file" id="lf" accept=".json,.costume" hidden>
<button id="expb" data-i="png" data-t="このコスチュームを書き出す(ビットマップはPNG、ベクターはSVG)。キャンバスサイズか画像サイズか選べます"></button>
<button id="bk" data-i="bk" data-t="自動バックアップを復元"></button>
<span class="sep"></span>
<button id="pvw" data-i="prev" data-t="コスチュームのプレビュー・アニメーション再生"></button>
<button id="tp" data-i="layers" data-t="レイヤー・数値指定パネルの表示切替"></button>
<button id="flt" data-i="adj" data-t="画像フィルター(ビットマップ用)"></button>
<button id="s3o" data-i="pkgout" data-t="現在のスプライトを.sprite3で書き出し(全コスチューム・Scratch用)"></button><button id="sb3o" data-i="pkgout" data-t="プロジェクト全体(全スプライト+ステージ)を.sb3で書き出し(Scratch用)"></button><button id="s3i" data-i="pkgin" data-t=".sprite3 / .sb3を読み込み(.sb3はプロジェクト全体を置き換え)"></button><input type="file" id="s3f" accept=".sprite3,.sb3,.zip" hidden>
<button id="svi" data-i="svgin" data-t="SVGを編集可能なベクター図形として読み込む"></button><input type="file" id="svf" accept=".svg,image/svg+xml" hidden>
<button id="v2b" data-i="conv" data-t="ベクター→ビットマップに変換"></button>
<button id="hlp" data-i="help" data-t="ショートカット一覧(?)"></button>
</div>
<div id="spbar" role="toolbar" aria-label="スプライト"><input id="spname" type="text" maxlength="60" spellcheck="false" autocomplete="off" aria-label="スプライトの名前(Enterで確定)" title="スプライトの名前を変更(Enterで確定、Escで元に戻す)。「ファイル名//スプライト名」と付けると、そのファイルにまとまります"><div id="spbtns"><button id="spadd" data-i="spadd" data-l="追加" data-t="スプライトを追加(空のスプライトを新規作成)"></button><button id="spdup" data-i="dup" data-l="複製" data-t="現在のスプライトを複製(全コスチュームごと)"></button><button id="spdel" data-i="del" data-l="削除" data-t="現在のスプライトを削除"></button></div><div id="spl" role="tablist" aria-label="スプライト一覧(右クリック/長押しでコピー・削除メニュー)"></div></div>
<div id="lcol"><div id="lhead"></div><div id="lvn" role="group" aria-label="コスチュームの表示数" title="コスチュームの表示数(1画面に表示する数)"><span>表示数</span><button id="lvm" type="button" title="表示するコスチュームの数を減らす(大きく表示)" aria-label="表示数を減らす">−</button><b id="lvv" aria-live="polite">4</b><button id="lvp" type="button" title="表示するコスチュームの数を増やす(小さく表示)" aria-label="表示数を増やす">＋</button></div><div id="list"></div></div><div id="tools"></div>
<div id="fpop" role="listbox" aria-label="フォント一覧" hidden></div>
<div id="main"><canvas id="cv"></canvas><input id="te_in" type="text" hidden autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="文字を入力(Enterで確定)"><div id="shpp" hidden></div>
<div id="onion" role="group" aria-label="オニオンスキン"><button id="onb" data-i="onion" data-l="オニオン" data-t="オニオンスキン: 前後のコスチュームを半透明のガイドとして重ねて表示(ガイドは選択・編集できず、保存や書き出しにも含まれません)" aria-pressed="false"></button><span class="grp" id="onx" hidden><button id="onp" data-i="onprev" data-l="前" data-t="一つ前のコスチュームを表示"></button><button id="onn" data-i="onnext" data-l="次" data-t="一つ後のコスチュームを表示"></button><button id="onc" data-i="oncol" data-l="色分け" data-t="前=赤・次=青に色分けして表示"></button><label class="onl"><span>枚数</span><input type="number" id="onnum" min="1" max="20" step="1" value="1" inputmode="numeric" data-clamp="1" aria-label="ガイドとして表示するコスチュームの枚数(前後それぞれ。2なら2つ先まで)" title="前後それぞれ何個先のコスチュームまで表示するか(2なら2つ先まで。遠いほど薄くなります)"></label><label class="onl"><span>透明度(%)</span><input type="number" id="onop" min="10" max="80" step="5" value="35" inputmode="numeric" data-clamp="1" aria-label="ガイドの透明度(%)"></label></span></div>
<div id="more" hidden></div><div id="side" hidden><div id="nm_wrap"><h4>数値指定(中心基準・度)</h4><div class="nm" id="nm">
<label>X<input type="number" id="qx" step="any" aria-label="中心X"></label><label>Y<input type="number" id="qy" step="any" aria-label="中心Y"></label>
<label>幅<input type="number" id="qw" step="any" min="1" aria-label="幅"></label><label>高<input type="number" id="qh" step="any" min="1" aria-label="高さ"></label>
<label>角度<input type="number" id="qa" step="any" aria-label="回転角度(度)"></label><label><input type="checkbox" id="qk">比率固定</label></div></div>
<div id="ly_wrap"><h4>レイヤー</h4><div class="grp" id="lbar">
<button id="lyu" data-i="arrU" data-t="1つ前面へ"></button><button id="lyd" data-i="arrD" data-t="1つ背面へ"></button><button id="lyn" data-i="ren" data-t="レイヤー名を変更"></button>
<button id="ly_dp" data-i="dup" data-t="複製"></button><button id="ly_dl" data-i="del" data-t="削除"></button>
<button id="ly_gp" data-i="group" data-t="グループ化"></button><button id="ly_ug" data-i="ungroup" data-t="グループ解除"></button>
<button id="ly_fr" data-i="front" data-t="最前面へ"></button><button id="ly_bkb" data-i="back" data-t="最背面へ"></button></div><div id="ly"></div></div>
<div id="bly_wrap" hidden><h4>レイヤー(ビットマップ)</h4>
<div id="bly_off"><small>通常は1枚の画像として編集します。レイヤーを使うと、今の絵を1枚目にして重ね描きできます。</small><button type="button" id="bly_use" class="bly-use">レイヤーを使う</button></div>
<div id="bly_on" hidden><div id="bly_bar">
<button type="button" id="bly_add" data-i="spadd" data-t="レイヤーを追加"></button><button type="button" id="bly_dp" data-i="dup" data-t="レイヤーを複製"></button><button type="button" id="bly_dl" data-i="del" data-t="レイヤーを削除"></button>
<button type="button" id="bly_up" data-i="arrU" data-t="1つ上へ"></button><button type="button" id="bly_dn" data-i="arrD" data-t="1つ下へ"></button><button type="button" id="bly_rn" data-i="ren" data-t="名前を変更(行をダブルクリックでも可)"></button>
<button type="button" id="bly_mg" data-i="merge" data-t="結合(下と結合・表示中を結合・通常の画像に戻す)"></button><button type="button" id="bly_sp" data-i="cut" data-t="選択範囲を新しいレイヤーに分ける(「範囲」ツールで選んでから)"></button></div>
<label class="bly-op">不透明度<input type="range" id="bly_op" min="0" max="100" step="1" value="100" aria-label="レイヤーの不透明度"><input type="number" id="bly_opn" min="0" max="100" step="1" value="100" inputmode="numeric" aria-label="不透明度(%)">%</label>
<div id="bly"></div></div></div></div></div>
<div id="prop">
<span class="grp" id="g_col">
<span id="l_fc"><button id="cf" data-i="fillon" data-t="塗りの色(タップでカラーピッカー)"></button><input type="hidden" id="fc" value="#855cd6"></span>
<label class="tg"><input type="checkbox" id="fo" checked><span data-i="fillon" data-t="塗りあり/なし"></span></label>
<span class="grp" id="g_gr"><button id="gs" data-i="gsolid" data-t="塗り:単色"></button><button id="gh" data-i="ghor" data-t="塗り:グラデーション(横)"></button><button id="gv" data-i="gver" data-t="塗り:グラデーション(縦)"></button><button id="gr" data-i="grad" data-t="塗り:グラデーション(放射)"></button>
<span id="l_fc2"><button id="c2" data-i="grad2" data-t="グラデーションの2色目"></button><input type="hidden" id="fc2" value="#ffd500"></span></span>
<span id="l_sc"><button id="cs" data-i="strokeon" data-t="線の色(タップでカラーピッカー)"></button><input type="hidden" id="sc" value="#001026"></span>
<label class="tg" id="l_so"><input type="checkbox" id="so" checked><span data-i="strokeon" data-t="線あり/なし"></span></label>
<span class="grp" id="g_sj" role="group" aria-label="縁(線)の角の形"><button type="button" id="sjm" data-i="joinm" data-t="縁の角: 角(シャープ。角を丸めず尖らせます)" data-l="角"></button><button type="button" id="sjr" data-i="joinr" data-t="縁の角: 丸(角を自然に丸めます)" data-l="丸"></button></span>
<label class="swl"><span data-i="sw" data-t="太さ / ブラシサイズ(小数可)。縁の太さを0にすると縁なし。ペン・ブラシ類は0にすると1に自動補正"></span><input type="number" id="sw" min="0" step="any" value="4" inputmode="decimal" aria-label="太さ(px)"><span class="un">px</span></label>
</span>
<span class="grp" id="g_rr"><label><span data-i="round" data-t="角の丸み"></span><input type="number" id="rr" min="0" max="100" step="1" value="0" inputmode="numeric" data-clamp="1" aria-label="角の丸み"></label></span>
<span class="grp" id="g_pg"><label><span data-i="poly" data-t="多角形の辺の数"></span><input type="number" id="ns" min="3" max="24" value="5"></label>
<label><span data-i="star" data-t="凹み(星型にする)"></span><input type="number" id="ind" min="0" max="90" step="1" value="0" inputmode="numeric" data-clamp="1" aria-label="凹み(星型)"></label></span>
<span class="grp" id="g_ft"><span class="fwrap"><span data-i="font" data-t="フォント"></span><button type="button" id="fnb" class="fnb" aria-haspopup="listbox" aria-expanded="false" title="フォントを選ぶ(各フォントで表示されます)"><span class="fnt">Sans Serif</span><i class="car"></i></button><input type="hidden" id="fn" value="0"></span>
<button id="addf" data-i="addfont" data-t="フォントファイル(ttf/otf/woff/woff2)を追加"></button><input type="file" id="ff" accept=".ttf,.otf,.woff,.woff2" hidden>
<button id="sysf" data-i="sysfont" data-t="システムフォント名を追加"></button>
<button id="te" data-i="edit" data-t="選択した文字を編集"></button><button id="t2p" data-i="outline" data-t="選択した文字をベクターパス(図形)に変換" data-l="図形化"></button><button id="p2t" data-i="totext" data-t="図形化した文字を元のテキストに戻す" data-l="文字へ"></button><label id="tovl" data-t="ON:文字を確定すると自動で図形化 / OFF:従来どおりテキスト"><input type="checkbox" id="tov">自動図形化</label></span>
<span class="grp" id="g_rsh"><button id="pth" data-i="pathop" data-t="ポイント整列・水平化/垂直化・点の結合・パス操作" data-l="パス操作"></button><button id="delpt" data-i="delpt" data-t="選択した点を削除(線の上をタップすると点を追加)"></button><button id="ptm" data-i="ptmode" data-t="選択した点を滑らか/角に切り替え"></button><button id="symb" data-i="sym" data-l="対称" data-t="対称編集モード: ONの間(またはShiftを押している間)は、ドラッグしたハンドルと反対側のハンドルを同一直線・正反対・同じ長さで連動。OFFでは左右のハンドルを独立して編集"></button></span>
<span class="grp" id="g_bo"><button id="bcp" data-i="copy" data-t="選択範囲をコピー"></button><button id="bct" data-i="scissors" data-t="選択範囲を切り取り"></button><button id="bps" data-i="paste" data-t="貼り付け"></button><button id="bdel" data-i="del" data-t="選択範囲を削除"></button></span>
<span class="grp" id="g_fl"><button id="bfh" data-i="bfh" data-t="選択中を左右反転(ビットマップは選択範囲、ベクターは選択した図形)"></button><button id="bfv" data-i="bfv" data-t="選択中を上下反転(ビットマップは選択範囲、ベクターは選択した図形)"></button></span>
<span class="grp" id="g_bpen"><button id="bclean" data-i="clean" data-t="画像全体の半透明ピクセルをなくす(アルファ50%未満は透明、以上は不透明にします。Undo可)" data-l="半透明除去"></button><label class="tg"><input type="checkbox" id="aa"><span data-i="aa" data-t="アンチエイリアス ON/OFF(OFFでくっきりしたドット)"></span></label><span class="grp" id="g_pk"></span></span>
<span class="grp" id="g_nd"><button id="nl" data-i="arrL" data-t="選択範囲を左へ1px移動(長押しで連続・矢印キー対応)"></button><button id="nu" data-i="arrU" data-t="選択範囲を上へ1px移動"></button><button id="nd" data-i="arrD" data-t="選択範囲を下へ1px移動"></button><button id="nr" data-i="arrR" data-t="選択範囲を右へ1px移動"></button><span id="bsinfo" aria-live="polite"></span></span>
<span class="grp" id="g_fall"><label class="tg"><input type="checkbox" id="fall"><span data-i="fall" data-t="同じ色を一括で塗る(Ctrl/⌘を押しながらクリックでも同じ動作)"></span></label><label class="swl ftl"><span data-i="ftol" data-t="塗る色の範囲(0〜100)。大きいほど似た色まで塗ります。0=完全に同じ色だけ。ビットマップはクリックした色との差、ベクターは「同色一括」の対象を決めます"></span><input type="number" id="ftol" min="0" max="100" step="1" value="4" inputmode="numeric" data-clamp="1" aria-label="塗る色の範囲(0は完全に同じ色だけ)"><output id="ftolv" hidden>4</output></label></span>
<span class="grp" id="g_bf"><label class="tg"><input type="checkbox" id="bf" checked><span data-i="filled" data-t="図形を塗りつぶす/枠のみ"></span></label></span>
<span class="grp" id="g_ops"><button id="arr" data-i="alignp" data-t="整列・等間隔・グリッド配置(複数の図形を選択)" data-l="配置"></button>
<span class="sep"></span>
<button id="mu" data-i="multi" data-t="複数選択モード(タッチ用)"></button>
<button id="fr" data-i="front" data-t="前面へ"></button><button id="bkb" data-i="back" data-t="背面へ"></button>
<button id="dp" data-i="dup" data-t="図形を複製"></button><button id="dl" data-i="del" data-t="図形を削除"></button>
<button id="gp" data-i="group" data-t="グループ化"></button><button id="ug" data-i="ungroup" data-t="グループ解除"></button>
<span class="sep"></span>
<button id="bmg" data-i="merge" data-t="結合(複数の図形を1つに)"></button>
<button id="bmk" data-i="mask" data-t="マスク(重なる部分だけ残す)"></button>
<button id="bsb" data-i="sub" data-t="減算(背面の図形から前面の図形を引く)"></button>
<button id="bft" data-i="filter" data-t="フィルター(重なる部分を取り除く)"></button>
<select id="al" aria-label="整列" title="整列"><option value="">整列</option><option value="l">左揃え</option><option value="c">左右中央</option><option value="r">右揃え</option><option value="t">上揃え</option><option value="m">上下中央</option><option value="b">下揃え</option></select>
</span></div></div>
<div id="cp" hidden role="dialog" aria-label="カラーピッカー">
<div class="cp-row"><span class="grp" id="cp_tg"></span><button id="cp_x" data-i="close" data-t="閉じる"></button></div>
<div id="cp_svw"><canvas id="cp_sv" width="280" height="160"></canvas><i id="cp_svt"></i></div>
<div class="cp-sl" id="cp_h"><i></i></div>
<div class="cp-sl cp-al" id="cp_a"><b></b><i></i></div>
<div class="cp-row"><div id="cp_cmp"><button id="cp_old" class="ck" title="変更前の色(タップで戻す)" aria-label="変更前の色に戻す"></button><span id="cp_new" class="ck" title="変更後の色"></span></div>
<button id="cp_eye" data-i="eyedrop" data-t="スポイトで色を取得"></button><button id="cp_none" data-i="nofill" data-t="なし"></button><button id="cp_tr" data-i="checker" data-t="透明にする(不透明度0)"></button></div>
<div class="cp-row cp-in"><label>HEX<input id="cp_hex" type="text" maxlength="9" spellcheck="false" autocomplete="off"></label><label>R<input id="cp_r" type="number" min="0" max="255"></label><label>G<input id="cp_g" type="number" min="0" max="255"></label><label>B<input id="cp_b" type="number" min="0" max="255"></label><label>A<input id="cp_al" type="number" min="0" max="1" step="0.01"></label></div>
<div class="cp-row cp-in"><label>RGBA<input id="cp_rgba" type="text" spellcheck="false" autocomplete="off"></label></div>
<div class="cp-lab">最近使った色</div><div class="cp-sw" id="cp_rec"></div>
<div class="cp-lab">マイカラー<span class="grp"><button id="cp_add" data-i="plus" data-t="現在の色をマイカラーに登録"></button><button id="cp_del" data-i="del" data-t="削除モード(タップした色を削除)"></button></span></div><div class="cp-sw" id="cp_cus"></div>
</div>
<!-- 外部ライブラリ: Paper.js（結合・マスク・減算・フィルター・切り取り・ベクター消しゴムで使用） -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-core.min.js"></script>
<script src="./costume-editor.js"></script>
<script src="./bitmap-layers.js"></script>
<script src="./animation.js"></script>
<script src="./sound-editor.js"></script>
</body></html>
