<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>コスチュームエディター</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;font:14px system-ui,sans-serif;background:#e9eef2;color:#575e75;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{display:grid;height:100%;grid-template:"top top top" auto "list tools main" 1fr "list prop prop" auto/100px 56px 1fr}
button,select,input[type=number]{min-height:44px;min-width:44px;border:1px solid #c9d0d9;background:#fff;border-radius:8px;font:inherit;color:inherit;padding:0 6px}
button{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}
button small{font-size:9px;line-height:1}
button:hover,.tg span:hover,.cl span:hover{background:#eef0ff}
button:active{background:#d9c9f7}
button.on,.tg input:checked+span{background:#855cd6;color:#fff;border-color:#855cd6}
button:disabled{opacity:.35;pointer-events:none}
button:focus-visible,input:focus-visible+span,select:focus-visible{outline:3px solid #4c97ff;outline-offset:1px}
svg{display:block}
#top,#prop{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:#fff;align-items:center}
#top{grid-area:top;border-bottom:1px solid #c9d0d9}#prop{grid-area:prop;border-top:1px solid #c9d0d9}
.grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.sep{width:1px;height:32px;background:#c9d0d9;margin:0 2px}
#lcol{grid-area:list;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:#d9e3f2;border-right:1px solid #c9d0d9}#lhead{display:flex;flex-wrap:wrap;gap:3px;padding:3px;background:#c7d5ea}#lhead button{flex:1 0 40%;min-height:40px}#list{flex:1;overflow:auto;padding:4px}
.ci{background:#fff;border:2px solid transparent;border-radius:8px;margin-bottom:6px;padding:2px;text-align:center;font-size:11px;position:relative}
.ci.on{border-color:#855cd6}.ci i{position:absolute;left:4px;top:2px;font-style:normal}
.ci canvas{width:100%;background:#eee;border-radius:4px;display:block}
.ci span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#tools{grid-area:tools;display:flex;flex-direction:column;gap:4px;padding:4px;background:#fff;overflow:auto;border-right:1px solid #c9d0d9}
#tools button{min-height:48px;padding:0}
#main{grid-area:main;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#shpp{position:absolute;left:6px;top:6px;right:6px;max-height:55%;overflow:auto;background:#fff;border:1px solid #c9d0d9;border-radius:10px;padding:6px;box-shadow:0 2px 10px #0003}
#shpp h4{margin:6px 0 2px;font-size:12px}#shpp div{display:flex;flex-wrap:wrap;gap:4px}#shpp button{padding:4px}
input[type=color]{width:44px;height:44px;border:1px solid #c9d0d9;border-radius:8px;padding:2px;background:#fff}
label{display:flex;align-items:center;gap:3px}input[type=range]{width:84px}input[type=number]{width:60px}
.tg,.cl{position:relative}.tg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0}
.tg span{display:flex;min-width:44px;min-height:44px;border:1px solid #c9d0d9;border-radius:8px;background:#fff;align-items:center;justify-content:center}
.cl span{display:flex}
@media(max-width:700px){#app{grid-template:"top" auto "list" auto "tools" auto "main" 1fr "prop" auto/1fr}
#list{display:flex;gap:4px;padding:4px}.ci{min-width:72px;margin:0}#tools{flex-direction:row;border:0}#tools button{min-width:48px}}
.ck{background:linear-gradient(var(--c,#000),var(--c,#000)),conic-gradient(#ccc 25%,#fff 0 50%,#ccc 0 75%,#fff 0) 0 0/10px 10px}
.chip{display:block;position:relative;width:20px;height:20px;border-radius:5px;border:1px solid #0005;flex:none}
.chip.none::after{content:"";position:absolute;left:-1px;top:8px;width:22px;height:3px;background:#e33;transform:rotate(-45deg);border-radius:2px}
#cf,#cs,#c2{flex-direction:row;gap:3px;padding:0 5px;min-width:56px;min-height:38px}#cf.cur,#cs.cur,#c2.cur{outline:2px solid #855cd6;outline-offset:1px}
#cp button{min-height:32px;min-width:32px;padding:0 4px}#cp .cp-row{gap:4px}.cp-lab{font-size:11px}
#cp{position:fixed;z-index:50;width:248px;max-width:calc(100vw - 8px);background:#fff;border:1px solid #c9d0d9;border-radius:10px;box-shadow:0 6px 24px #0004;padding:6px;display:flex;flex-direction:column;gap:5px;font-size:12px;max-height:92vh;overflow:auto}
#cp[hidden]{display:none}#cp.hid{visibility:hidden}
#cp_svw{position:relative;touch-action:none;border-radius:8px;overflow:hidden;height:112px;flex:none}#cp_sv{width:100%;height:100%;display:block}
#cp_svt,.cp-sl i{position:absolute;width:18px;height:18px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #0008;transform:translate(-50%,-50%);pointer-events:none}
.cp-sl{position:relative;height:22px;border-radius:11px;touch-action:none;border:1px solid #c9d0d9;flex:none}.cp-sl i{top:50%}
#cp_h{background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.cp-al{background:conic-gradient(#ccc 25%,#fff 0 50%,#ccc 0 75%,#fff 0) 0 0/10px 10px}.cp-al b{position:absolute;inset:0;border-radius:11px}
.cp-row{display:flex;gap:6px;align-items:center}.cp-row>.grp{flex:1}
#cp_cmp{display:flex;flex:1;height:32px;border-radius:8px;overflow:hidden;border:1px solid #c9d0d9}
#cp_cmp>*{flex:1;border:0;border-radius:0;padding:0;min-width:0;min-height:0}
.cp-in label{flex-direction:column;align-items:stretch;font-size:11px;flex:1;gap:1px}.cp-in input{min-width:0;width:100%;min-height:30px;border:1px solid #c9d0d9;border-radius:6px;padding:0 3px;font:inherit;font-size:12px}
.cp-in label:first-child{flex:2}
.cp-lab{font-size:12px;display:flex;justify-content:space-between;align-items:center}
.cp-sw{display:flex;flex-wrap:wrap;gap:6px;min-height:8px}.cp-sw button{width:30px;height:30px;min-width:0;min-height:0;padding:0;border-radius:8px}.cp-sw button.sel,#cp_tg button.on .chip{outline:3px solid #855cd6;outline-offset:1px}
#g_pk{gap:2px}
@media(max-width:700px){#cp{left:4px!important;right:4px;top:auto!important;bottom:4px;width:auto;max-height:78vh}}
#bsinfo{font-size:12px;line-height:1.3;min-width:96px;white-space:pre}
#side{position:absolute;right:6px;top:6px;width:212px;max-width:calc(100% - 12px);max-height:calc(100% - 12px);overflow:auto;background:#fff;border:1px solid #c9d0d9;border-radius:10px;padding:6px;box-shadow:0 2px 10px #0003;font-size:12px;z-index:5}
#side h4{margin:4px 0;font-size:12px}#side button{min-height:36px;min-width:36px}
.nm{display:grid;grid-template-columns:1fr 1fr;gap:4px}.nm label{flex-direction:column;align-items:stretch;gap:1px}#nm input[type=number]{width:100%;min-width:0;min-height:34px}#nm input[type=checkbox]{min-height:0}
#ly{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.lr{display:flex;align-items:center;gap:2px;border:1px solid #e1e5ec;border-radius:6px;min-height:34px;cursor:pointer;background:#fff}.lr.on{background:#eadffb;border-color:#855cd6}.lr.hd span{opacity:.4}.lr.dr{outline:2px dashed #855cd6}
.lr button{min-height:30px!important;min-width:30px!important;padding:0;border:0;background:transparent}.lr span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dlg{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:100}.dlg>div{background:#fff;border-radius:12px;padding:12px;width:min(420px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow:auto;display:flex;flex-direction:column;gap:6px}.dlg label{justify-content:space-between}.dlg input[type=range]{width:50%}.dlg output{width:34px;text-align:right}
@media(max-width:700px){#side{top:auto;bottom:6px;max-height:45%}}
.tsep{display:block;width:32px;height:1px;background:#c9d0d9;margin:3px auto;flex:none}
#top{row-gap:2px}#top .grp{padding:0 2px;border-right:1px solid #c9d0d9}.fill{flex:1}
#more{position:absolute;left:6px;bottom:6px;max-width:calc(100% - 12px);background:#fff;border:1px solid #c9d0d9;border-radius:10px;padding:6px;box-shadow:0 2px 10px #0003;z-index:6;display:flex;flex-direction:column;gap:4px}#more h4{margin:2px 0;font-size:12px}#more .grp{gap:4px}
@media(max-width:700px){#lcol{flex-direction:column}#tools .tsep{width:1px;height:32px;margin:auto 3px}}
</style></head><body>
<div id="app">
<div id="top">
<button id="addv" data-i="addv" data-t="ベクターのコスチュームを追加" data-l="ベクター"></button>
<button id="addb" data-i="addb" data-t="ビットマップのコスチュームを追加" data-l="ビット"></button>
<button id="dupc" data-i="dup" data-t="コスチュームを複製"></button>
<button id="delc" data-i="del" data-t="コスチュームを削除"></button>
<button id="ren" data-i="ren" data-t="コスチューム名を変更"></button>
<button id="impb" data-i="imp" data-t="画像を読み込む(原寸)"></button><input type="file" id="imp" accept="image/*" hidden>
<span class="sep"></span>
<button id="undo" data-i="undo" data-t="元に戻す"></button><button id="redo" data-i="redo" data-t="やり直し"></button>
<button id="zi" data-i="zin" data-t="拡大"></button><button id="zo" data-i="zout" data-t="縮小"></button>
<button id="zf" data-i="fit" data-t="全体表示"></button><button id="z1" data-i="z1" data-t="等倍(100%)"></button>
<span class="sep"></span>
<button id="sv" data-i="save" data-t="プロジェクトを保存(JSON)"></button>
<button id="ld" data-i="load" data-t="プロジェクトを読み込む"></button><input type="file" id="lf" accept=".json" hidden>
<button id="png" data-i="png" data-t="PNGで書き出し"></button><button id="svgb" data-i="svg" data-t="SVGで書き出し"></button>
<button id="bk" data-i="bk" data-t="自動バックアップを復元"></button>
<span class="sep"></span>
<button id="tp" data-i="layers" data-t="レイヤー・数値指定パネルの表示切替"></button>
<button id="flt" data-i="adj" data-t="画像フィルター(ビットマップ用)"></button>
<button id="svi" data-i="svgin" data-t="SVGを編集可能なベクター図形として読み込む"></button><input type="file" id="svf" accept=".svg,image/svg+xml" hidden>
<button id="v2b" data-i="conv" data-t="ベクター→ビットマップに変換"></button>
<button id="hlp" data-i="help" data-t="ショートカット一覧(?)"></button>
</div>
<div id="lcol"><div id="lhead"></div><div id="list"></div></div><div id="tools"></div>
<div id="main"><canvas id="cv"></canvas><div id="shpp" hidden></div>
<div id="more" hidden></div><div id="side" hidden><div id="nm_wrap"><h4>数値指定(中心基準・度)</h4><div class="nm" id="nm">
<label>X<input type="number" id="qx" step="any" aria-label="中心X"></label><label>Y<input type="number" id="qy" step="any" aria-label="中心Y"></label>
<label>幅<input type="number" id="qw" step="any" min="1" aria-label="幅"></label><label>高<input type="number" id="qh" step="any" min="1" aria-label="高さ"></label>
<label>角度<input type="number" id="qa" step="any" aria-label="回転角度(度)"></label><label><input type="checkbox" id="qk">比率固定</label></div></div>
<div id="ly_wrap"><h4>レイヤー</h4><div class="grp" id="lbar">
<button id="lyu" data-i="arrU" data-t="1つ前面へ"></button><button id="lyd" data-i="arrD" data-t="1つ背面へ"></button><button id="lyn" data-i="ren" data-t="レイヤー名を変更"></button>
<button id="ly_dp" data-i="dup" data-t="複製"></button><button id="ly_dl" data-i="del" data-t="削除"></button>
<button id="ly_gp" data-i="group" data-t="グループ化"></button><button id="ly_ug" data-i="ungroup" data-t="グループ解除"></button>
<button id="ly_fr" data-i="front" data-t="最前面へ"></button><button id="ly_bkb" data-i="back" data-t="最背面へ"></button></div><div id="ly"></div></div></div></div>
<div id="prop">
<span class="grp" id="g_col">
<span id="l_fc"><button id="cf" data-i="fillon" data-t="塗りの色(タップでカラーピッカー)"></button><input type="hidden" id="fc" value="#855cd6"></span>
<label class="tg"><input type="checkbox" id="fo" checked><span data-i="fillon" data-t="塗りあり/なし"></span></label>
<span class="grp" id="g_gr"><button id="gs" data-i="gsolid" data-t="塗り:単色"></button><button id="gh" data-i="ghor" data-t="塗り:グラデーション(横)"></button><button id="gv" data-i="gver" data-t="塗り:グラデーション(縦)"></button><button id="gr" data-i="grad" data-t="塗り:グラデーション(放射)"></button>
<span id="l_fc2"><button id="c2" data-i="grad2" data-t="グラデーションの2色目"></button><input type="hidden" id="fc2" value="#ffd500"></span></span>
<span id="l_sc"><button id="cs" data-i="strokeon" data-t="線の色(タップでカラーピッカー)"></button><input type="hidden" id="sc" value="#001026"></span>
<label class="tg" id="l_so"><input type="checkbox" id="so" checked><span data-i="strokeon" data-t="線あり/なし"></span></label>
<label><span data-i="sw" data-t="太さ / ブラシサイズ"></span><input type="range" id="sw" min="1" max="60" value="4"></label><span id="l_eye"><button id="eye" data-i="eyedrop" data-t="スポイト(描いた絵から色を取得。取得先は枠のついた色)"></button></span>
</span>
<span class="grp" id="g_rr"><label><span data-i="round" data-t="角の丸み"></span><input type="range" id="rr" min="0" max="100" value="0"></label></span>
<span class="grp" id="g_pg"><label><span data-i="poly" data-t="多角形の辺の数"></span><input type="number" id="ns" min="3" max="24" value="5"></label>
<label><span data-i="star" data-t="凹み(星型にする)"></span><input type="range" id="ind" min="0" max="90" value="0"></label></span>
<span class="grp" id="g_ft"><label><span data-i="font" data-t="フォント"></span><select id="fn"></select></label>
<button id="addf" data-i="addfont" data-t="フォントファイル(ttf/otf/woff/woff2)を追加"></button><input type="file" id="ff" accept=".ttf,.otf,.woff,.woff2" hidden>
<button id="sysf" data-i="sysfont" data-t="システムフォント名を追加"></button>
<button id="te" data-i="edit" data-t="選択した文字を編集"></button></span>
<span class="grp" id="g_rsh"><button id="delpt" data-i="delpt" data-t="選択した点を削除(線の上をタップすると点を追加)"></button><button id="ptm" data-i="ptmode" data-t="選択した点を滑らか/角に切り替え"></button></span>
<span class="grp" id="g_bo"><button id="bcp" data-i="copy" data-t="選択範囲をコピー"></button><button id="bct" data-i="scissors" data-t="選択範囲を切り取り"></button><button id="bps" data-i="paste" data-t="貼り付け"></button><button id="bdel" data-i="del" data-t="選択範囲を削除"></button><button id="bfh" data-i="bfh" data-t="選択範囲を左右反転"></button><button id="bfv" data-i="bfv" data-t="選択範囲を上下反転"></button></span>
<span class="grp" id="g_bpen"><label class="tg"><input type="checkbox" id="aa" checked><span data-i="aa" data-t="アンチエイリアス ON/OFF(OFFでくっきりしたドット)"></span></label><span class="grp" id="g_pk"></span></span>
<span class="grp" id="g_nd"><button id="nl" data-i="arrL" data-t="選択範囲を左へ1px移動(長押しで連続・矢印キー対応)"></button><button id="nu" data-i="arrU" data-t="選択範囲を上へ1px移動"></button><button id="nd" data-i="arrD" data-t="選択範囲を下へ1px移動"></button><button id="nr" data-i="arrR" data-t="選択範囲を右へ1px移動"></button><span id="bsinfo" aria-live="polite"></span></span>
<span class="grp" id="g_bf"><label class="tg"><input type="checkbox" id="bf" checked><span data-i="filled" data-t="図形を塗りつぶす/枠のみ"></span></label></span>
<span class="grp" id="g_ops">
<span class="sep"></span>
<button id="mu" data-i="multi" data-t="複数選択モード(タッチ用)"></button>
<button id="fr" data-i="front" data-t="前面へ"></button><button id="bkb" data-i="back" data-t="背面へ"></button>
<button id="dp" data-i="dup" data-t="図形を複製"></button><button id="dl" data-i="del" data-t="図形を削除"></button>
<button id="gp" data-i="group" data-t="グループ化"></button><button id="ug" data-i="ungroup" data-t="グループ解除"></button>
<span class="sep"></span>
<button id="bmg" data-i="merge" data-t="結合(複数の図形を1つに)"></button>
<button id="bmk" data-i="mask" data-t="マスク(重なる部分だけ残す)"></button>
<button id="bsb" data-i="sub" data-t="減算(背面の図形から前面の図形を引く)"></button>
<button id="bft" data-i="filter" data-t="フィルター(重なる部分を取り除く)"></button>
<select id="al" aria-label="整列" title="整列"><option value="">整列</option><option value="l">左揃え</option><option value="c">左右中央</option><option value="r">右揃え</option><option value="t">上揃え</option><option value="m">上下中央</option><option value="b">下揃え</option></select>
</span></div></div>
<div id="cp" hidden role="dialog" aria-label="カラーピッカー">
<div class="cp-row"><span class="grp" id="cp_tg"></span><button id="cp_x" data-i="close" data-t="閉じる"></button></div>
<div id="cp_svw"><canvas id="cp_sv" width="280" height="160"></canvas><i id="cp_svt"></i></div>
<div class="cp-sl" id="cp_h"><i></i></div>
<div class="cp-sl cp-al" id="cp_a"><b></b><i></i></div>
<div class="cp-row"><div id="cp_cmp"><button id="cp_old" class="ck" title="変更前の色(タップで戻す)" aria-label="変更前の色に戻す"></button><span id="cp_new" class="ck" title="変更後の色"></span></div>
<button id="cp_eye" data-i="eyedrop" data-t="スポイトで色を取得"></button><button id="cp_none" data-i="nofill" data-t="なし"></button><button id="cp_tr" data-i="checker" data-t="透明にする(不透明度0)"></button></div>
<div class="cp-row cp-in"><label>HEX<input id="cp_hex" type="text" maxlength="9" spellcheck="false" autocomplete="off"></label><label>R<input id="cp_r" type="number" min="0" max="255"></label><label>G<input id="cp_g" type="number" min="0" max="255"></label><label>B<input id="cp_b" type="number" min="0" max="255"></label><label>A<input id="cp_al" type="number" min="0" max="1" step="0.01"></label></div>
<div class="cp-row cp-in"><label>RGBA<input id="cp_rgba" type="text" spellcheck="false" autocomplete="off"></label></div>
<div class="cp-lab">最近使った色</div><div class="cp-sw" id="cp_rec"></div>
<div class="cp-lab">マイカラー<span class="grp"><button id="cp_add" data-i="plus" data-t="現在の色をマイカラーに登録"></button><button id="cp_del" data-i="del" data-t="削除モード(タップした色を削除)"></button></span></div><div class="cp-sw" id="cp_cus"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-core.min.js"></script>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),g=cv.getContext('2d');
let cs=[],ci=0,tool='sel',sel=[],z=1,ox=0,oy=0,multi=0,tmp=null,drag=null,dirty=0,band=null,gid=1,curShape=0,fonts=[],selPt=-1,gm='s',clip=null;
const C=()=>cs[ci],rep=(k,v)=>k=='im'?undefined:v,esc=s=>String(s).replace(/[&<>"]/g,m=>'&#'+m.charCodeAt(0)+';');
const K=[[-1,-1],[1,-1],[1,1],[-1,1]];
// ===== アイコン管理(すべてJS内SVG。追加・変更は IC に1行足すだけ) =====
const IC={
